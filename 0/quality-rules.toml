# Quality enforcement rules for AI+KO Service

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
as_conversions = "deny"
unimplemented = "deny"
todo = "deny"
await_holding_lock = "deny"
inefficient_to_string = "deny"
large_stack_arrays = "deny"
vec_init_then_push = "deny"
unwrap_in_result = "deny"
map_err_ignore = "deny"
needless_collect = "deny"
or_fun_call = "deny"
dbg_macro = "deny"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[workflow]
# Always run the full quality gate before marking a task/subtask done.
precommit_targets = ["make quality-check"]
ci_targets = ["make ci"]
require_tasks_guard = true
