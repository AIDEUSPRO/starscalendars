[toolchain]
channel = "stable"
components = [
    "cargo",
    "clippy",
    "rust-docs",
    "rust-src",
    "rust-std",
    "rustc",
    "rustfmt",
]
# Targets for web and common hosts
targets = [
    "wasm32-unknown-unknown",
    "x86_64-unknown-linux-gnu",       # Tier 1 - LLD linker by default since Rust 1.90.0
    "x86_64-apple-darwin",             # ⚠️ Tier 2 since Rust 1.90.0 (demoted from Tier 1)
    "aarch64-apple-darwin",            # Tier 2
]
profile = "default"
